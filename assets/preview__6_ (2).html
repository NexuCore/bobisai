<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS1 Video Recorder</title>
<style>
  body {
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #111;
    color: white;
    font-family: sans-serif;
  }
  canvas {
    image-rendering: pixelated;
    background: black;
    margin: 10px 0;
  }
  .controls {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
  }
  label {
    display: flex;
    flex-direction: column;
    font-size: 14px;
  }
  input[type="range"] {
    width: 150px;
  }
  button {
    padding: 8px 16px;
    font-size: 14px;
    cursor: pointer;
  }
  .mode-toggle {
    display: flex;
    border: 1px solid #444;
    border-radius: 6px;
    overflow: hidden;
  }
  .mode-toggle button {
    flex: 1;
    border: none;
    border-radius: 0;
    background: #222;
    color: #aaa;
    font-size: 14px;
    padding: 8px 18px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-toggle button.active {
    background: #e00;
    color: white;
    font-weight: bold;
  }
  .screen-audio-options label {
    flex-direction: row;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    cursor: pointer;
    margin-top: 4px;
  }
</style>
</head>
<body>

<h1>PS1 Video Recorder</h1>
<canvas id="canvas" width="160" height="120"></canvas>

<!-- Start overlay -->
<div id="startOverlay" style="
  position:fixed; inset:0; background:#111;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:16px; z-index:999;
">
  <div style="font-size:48px;">📼</div>
  <h2 style="margin:0; font-size:22px; text-align:center;">PS1 Video Recorder</h2>
  <p style="margin:0; color:#aaa; font-size:14px; text-align:center; max-width:260px;">
    Choose a mode to get started
  </p>
  <div class="mode-toggle" style="width:260px;">
    <button id="startCameraBtn" class="active">📷 Camera</button>
    <button id="startScreenBtn">🖥️ Screen</button>
  </div>
  <button id="startBtn" style="
    padding:14px 32px; font-size:16px; cursor:pointer;
    background:#e00; color:white; border:none; border-radius:6px;
    font-weight:bold; letter-spacing:1px;
  ">⏺ START</button>
  <p id="startError" style="color:#f88; font-size:13px; margin:0; display:none;"></p>
</div>

<!-- Controls -->
<div class="controls">
  <!-- Mode toggle -->
  <div style="width:100%; display:flex; justify-content:center;">
    <div class="mode-toggle">
      <button id="modeCameraBtn" class="active">📷 Camera</button>
      <button id="modeScreenBtn">🖥️ Screen Share</button>
    </div>
  </div>

  <!-- Shared sliders -->
  <label>Resolution<input type="range" id="resSlider" min="40" max="160" value="80"></label>
  <label>Color Depth<input type="range" id="colorSlider" min="8" max="32" value="16"></label>
  <label>Pixel Scale<input type="range" id="scaleSlider" min="2" max="10" value="6"></label>
  <label>Mic Volume<input type="range" id="micSlider" min="0" max="2" step="0.01" value="1"></label>
  <label>Distortion<input type="range" id="distortSlider" min="0" max="1" step="0.01" value="0.2"></label>

  <!-- Camera-only -->
  <label id="cameraSelectWrap">
    Camera
    <select id="cameraSelect" style="font-size:14px; padding:4px; background:#222; color:white; border:1px solid #444; border-radius:4px;">
      <option value="">Loading cameras...</option>
    </select>
  </label>

  <!-- Screen-only -->
  <div id="screenControls" style="display:none; flex-direction:column; gap:8px; align-items:flex-start;">
    <button id="shareScreenBtn" style="background:#333; color:white; border:1px solid #555; border-radius:4px;">🖥️ Pick Screen</button>
    <label style="font-size:14px; flex-direction:column;">
      Audio Sources
      <div class="screen-audio-options" style="display:flex; flex-direction:column;">
        <label><input type="checkbox" id="chkMic" checked> Microphone</label>
        <label><input type="checkbox" id="chkScreenAudio" checked> Screen Audio</label>
      </div>
    </label>
    <label style="font-size:14px;">
      Screen Vol
      <input type="range" id="screenVolSlider" min="0" max="2" step="0.01" value="1" style="width:150px;">
    </label>
  </div>

  <button id="recordBtn">Start Recording</button>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let WIDTH = 80, HEIGHT = 60, COLOR_DEPTH = 16, PIXEL_SCALE = 6;
let MIC_VOLUME = 1, DISTORTION = 0.2, SCREEN_VOL = 1;
let mode = 'camera';

const resSlider      = document.getElementById('resSlider');
const colorSlider    = document.getElementById('colorSlider');
const scaleSlider    = document.getElementById('scaleSlider');
const micSlider      = document.getElementById('micSlider');
const distortSlider  = document.getElementById('distortSlider');
const screenVolSlider= document.getElementById('screenVolSlider');
const recordBtn      = document.getElementById('recordBtn');
const cameraSelect   = document.getElementById('cameraSelect');
const cameraSelectWrap = document.getElementById('cameraSelectWrap');
const screenControls = document.getElementById('screenControls');
const shareScreenBtn = document.getElementById('shareScreenBtn');
const modeCameraBtn  = document.getElementById('modeCameraBtn');
const modeScreenBtn  = document.getElementById('modeScreenBtn');
const chkMic         = document.getElementById('chkMic');
const chkScreenAudio = document.getElementById('chkScreenAudio');

let selectedDeviceId = null;
let mediaRecorder, recordedChunks = [];
let videoStream = null;
let screenStream = null;
let micRawStream = null;
let audioContext, gainNode, screenGainNode, distortionNode, dest;
let currentVideo = null;

canvas.width = WIDTH; canvas.height = HEIGHT;
canvas.style.width = WIDTH * PIXEL_SCALE + 'px';
canvas.style.height = HEIGHT * PIXEL_SCALE + 'px';

// ── Mode switching ──────────────────────────────────────────
function setMode(m) {
  mode = m;
  modeCameraBtn.classList.toggle('active', m === 'camera');
  modeScreenBtn.classList.toggle('active', m === 'screen');
  cameraSelectWrap.style.display = m === 'camera' ? '' : 'none';
  screenControls.style.display   = m === 'screen'  ? 'flex' : 'none';

  if (m === 'camera') {
    if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
    setupCamera(selectedDeviceId).then(v => { currentVideo = v; buildAudioGraph(); });
  }
}
modeCameraBtn.addEventListener('click', () => setMode('camera'));
modeScreenBtn.addEventListener('click', () => setMode('screen'));

// ── Camera ──────────────────────────────────────────────────
async function setupCamera(deviceId) {
  if (videoStream) videoStream.getTracks().forEach(t => t.stop());
  const constraints = { video: deviceId ? { deviceId: { exact: deviceId } } : true };
  videoStream = await navigator.mediaDevices.getUserMedia(constraints);
  const v = document.createElement('video');
  v.srcObject = videoStream; v.play();
  return v;
}

async function populateCameras() {
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');
  cameraSelect.innerHTML = '';
  cams.forEach((cam, i) => {
    const o = document.createElement('option');
    o.value = cam.deviceId;
    o.textContent = cam.label || `Camera ${i+1}`;
    cameraSelect.appendChild(o);
  });
  if (cams.length) selectedDeviceId = cams[0].deviceId;
}

cameraSelect.addEventListener('change', async () => {
  if (mode !== 'camera') return;
  selectedDeviceId = cameraSelect.value;
  currentVideo = await setupCamera(selectedDeviceId);
});

// ── Screen share ────────────────────────────────────────────
shareScreenBtn.addEventListener('click', async () => {
  try {
    if (screenStream) screenStream.getTracks().forEach(t => t.stop());
    screenStream = await navigator.mediaDevices.getDisplayMedia({
      video: true,
      audio: true  // will include screen audio if browser/OS supports it
    });
    const v = document.createElement('video');
    v.srcObject = screenStream; v.play();
    currentVideo = v;
    buildAudioGraph();
    screenStream.getVideoTracks()[0].addEventListener('ended', () => {
      screenStream = null; currentVideo = null;
    });
    shareScreenBtn.textContent = '🔄 Change Screen';
  } catch(err) {
    alert('Screen share failed: ' + err.message);
  }
});

// ── Microphone ──────────────────────────────────────────────
async function setupMicrophone() {
  micRawStream = await navigator.mediaDevices.getUserMedia({ audio: true });
}

// ── Audio graph ─────────────────────────────────────────────
function buildAudioGraph() {
  if (!audioContext) audioContext = new AudioContext();

  try { if (distortionNode) distortionNode.disconnect(); } catch(e) {}
  try { if (gainNode) gainNode.disconnect(); } catch(e) {}
  try { if (screenGainNode) screenGainNode.disconnect(); } catch(e) {}

  distortionNode = audioContext.createWaveShaper();
  setDistortionCurve(DISTORTION);
  dest = audioContext.createMediaStreamDestination();
  distortionNode.connect(dest);

  // Mic
  if (chkMic.checked && micRawStream) {
    gainNode = audioContext.createGain();
    gainNode.gain.value = MIC_VOLUME;
    audioContext.createMediaStreamSource(micRawStream).connect(gainNode);
    gainNode.connect(distortionNode);
  }

  // Screen audio
  if (mode === 'screen' && chkScreenAudio.checked && screenStream) {
    const tracks = screenStream.getAudioTracks();
    if (tracks.length) {
      screenGainNode = audioContext.createGain();
      screenGainNode.gain.value = SCREEN_VOL;
      audioContext.createMediaStreamSource(new MediaStream(tracks)).connect(screenGainNode);
      screenGainNode.connect(distortionNode);
    }
  }

  return dest.stream;
}

function setDistortionCurve(amount) {
  if (!distortionNode) return;
  const n = 44100; const curve = new Float32Array(n); const k = amount * 100;
  for (let i = 0; i < n; i++) {
    const x = (i * 2 / n) - 1;
    curve[i] = ((3 + k) * x * 20 * Math.PI / 180) / (Math.PI + k * Math.abs(x));
  }
  distortionNode.curve = curve;
  distortionNode.oversample = '4x';
}

// ── PS1 effect ──────────────────────────────────────────────
function ps1Effect(imageData) {
  const d = imageData.data;
  for (let i = 0; i < d.length; i += 4) {
    d[i]   = Math.floor(d[i]   / COLOR_DEPTH) * COLOR_DEPTH;
    d[i+1] = Math.floor(d[i+1] / COLOR_DEPTH) * COLOR_DEPTH;
    d[i+2] = Math.floor(d[i+2] / COLOR_DEPTH) * COLOR_DEPTH;
  }
  return imageData;
}

// ── Date overlay ─────────────────────────────────────────────
function drawDateOverlay() {
  const now = new Date();
  const pad = n => String(n).padStart(2,'0');
  const dateStr = `${pad(now.getDate())}.${pad(now.getMonth()+1)}.${now.getFullYear()}`;
  const timeStr = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const fontSize = Math.max(4, Math.floor(WIDTH * 0.075));
  const p = Math.max(2, Math.floor(WIDTH * 0.03));
  const gap = Math.floor(fontSize * 1.3);
  ctx.font = `${fontSize}px monospace`; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillText(dateStr, p+1, p+1); ctx.fillText(timeStr, p+1, p+gap+1);
  ctx.fillStyle = '#ffffaa';
  ctx.fillText(dateStr, p, p); ctx.fillText(timeStr, p, p+gap);
}

// ── Draw loop ─────────────────────────────────────────────────
function startDrawLoop() {
  function draw() {
    if (currentVideo && currentVideo.readyState >= 2) {
      ctx.drawImage(currentVideo, 0, 0, WIDTH, HEIGHT);
      let frame = ctx.getImageData(0, 0, WIDTH, HEIGHT);
      frame = ps1Effect(frame);
      ctx.putImageData(frame, 0, 0);
    }
    drawDateOverlay();
    requestAnimationFrame(draw);
  }
  draw();
}

// ── Sliders ───────────────────────────────────────────────────
resSlider.addEventListener('input', () => {
  WIDTH = parseInt(resSlider.value); HEIGHT = Math.floor(WIDTH * 0.75);
  canvas.width = WIDTH; canvas.height = HEIGHT;
  canvas.style.width = WIDTH * PIXEL_SCALE + 'px';
  canvas.style.height = HEIGHT * PIXEL_SCALE + 'px';
});
colorSlider.addEventListener('input', () => COLOR_DEPTH = parseInt(colorSlider.value));
scaleSlider.addEventListener('input', () => {
  PIXEL_SCALE = parseInt(scaleSlider.value);
  canvas.style.width = WIDTH * PIXEL_SCALE + 'px';
  canvas.style.height = HEIGHT * PIXEL_SCALE + 'px';
});
micSlider.addEventListener('input', () => {
  MIC_VOLUME = parseFloat(micSlider.value);
  if (gainNode) gainNode.gain.value = MIC_VOLUME;
});
distortSlider.addEventListener('input', () => {
  DISTORTION = parseFloat(distortSlider.value);
  setDistortionCurve(DISTORTION);
});
screenVolSlider.addEventListener('input', () => {
  SCREEN_VOL = parseFloat(screenVolSlider.value);
  if (screenGainNode) screenGainNode.gain.value = SCREEN_VOL;
});
chkMic.addEventListener('change', buildAudioGraph);
chkScreenAudio.addEventListener('change', buildAudioGraph);

// ── Recording ─────────────────────────────────────────────────
recordBtn.addEventListener('click', () => {
  if (!mediaRecorder || mediaRecorder.state === 'inactive') {
    recordedChunks = [];
    const processedAudio = buildAudioGraph();
    const mimeType = MediaRecorder.isTypeSupported('video/webm; codecs=vp9')
      ? 'video/webm; codecs=vp9' : 'video/webm';
    const combined = new MediaStream([
      ...canvas.captureStream(30).getVideoTracks(),
      ...processedAudio.getAudioTracks()
    ]);
    mediaRecorder = new MediaRecorder(combined, { mimeType });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'ps1_video.webm'; a.click();
      URL.revokeObjectURL(url);
    };
    mediaRecorder.start();
    recordBtn.textContent = 'Stop Recording';
  } else if (mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    recordBtn.textContent = 'Start Recording';
  }
});

// ── Start overlay ─────────────────────────────────────────────
const startOverlay  = document.getElementById('startOverlay');
const startBtn      = document.getElementById('startBtn');
const startError    = document.getElementById('startError');
const startCameraBtn= document.getElementById('startCameraBtn');
const startScreenBtn= document.getElementById('startScreenBtn');

let startMode = 'camera';
startCameraBtn.addEventListener('click', () => {
  startMode = 'camera';
  startCameraBtn.classList.add('active');
  startScreenBtn.classList.remove('active');
});
startScreenBtn.addEventListener('click', () => {
  startMode = 'screen';
  startScreenBtn.classList.add('active');
  startCameraBtn.classList.remove('active');
});

startBtn.addEventListener('click', async () => {
  startBtn.textContent = 'Starting…';
  startBtn.disabled = true;
  try {
    await setupMicrophone();
    audioContext = new AudioContext();

    if (startMode === 'camera') {
      await populateCameras();
      currentVideo = await setupCamera(selectedDeviceId);
      buildAudioGraph();
      startDrawLoop();
      setMode('camera');
    } else {
      await populateCameras();
      buildAudioGraph();
      startDrawLoop();
      setMode('screen');
    }

    startOverlay.style.display = 'none';
  } catch(err) {
    startError.textContent = 'Error: ' + err.message;
    startError.style.display = 'block';
    startBtn.textContent = '⏺ START';
    startBtn.disabled = false;
  }
});
</script>

</body>
</html>
